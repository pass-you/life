<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#faf7f5">
  <title>人生日历 · Life Calendar</title>
  <meta name="description" content="以日、月、年为三级页面的人生日历：记录每天的工作，安排明天的计划。">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- 海报 CDN 提前建连：打开找电影时首屏海报不用再等 DNS + TLS。 -->
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="preconnect" href="https://images.metahub.space" crossorigin>
  <link rel="dns-prefetch" href="https://api.tmdb.org">
  <link rel="dns-prefetch" href="https://v3-cinemeta.strem.io">
  <link rel="stylesheet" href="assets/vendor/vditor/dist/index.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <div id="weather-overlay" class="weather-overlay" aria-hidden="true" hidden></div>
    <header class="topbar">
      <a class="brand" href="#/" aria-label="回到今天">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">人生日历</span>
      </a>

      <nav id="crumbs" class="crumbs" aria-label="当前位置"></nav>

      <div class="theme">
        <span class="theme-label">主题</span>
        <div id="swatches" class="swatches" role="group" aria-label="选择主题色"></div>
        <label class="custom-color" title="自定义主题色">
          <input id="colorInput" type="color" aria-label="自定义主题色">
          <span aria-hidden="true">+</span>
        </label>
      </div>
    </header>

    <div class="filebar">
      <div class="file-status-wrap">
        <p id="fileStatus" class="file-status" role="status" aria-live="polite">未连接文件 · 选择保存位置后自动同步</p>
        <p id="cloudStatus" class="cloud-status" role="status" aria-live="polite" tabindex="0" hidden></p>
      </div>
      <div class="file-actions">
        <button type="button" class="btn btn-sm" id="cloudBtn">云端同步</button>
        <button type="button" class="btn btn-sm btn-primary" id="saveAsBtn">选择保存位置</button>
        <button type="button" class="btn btn-sm" id="openBtn">打开 MD</button>
        <button type="button" class="btn btn-sm" id="exportBtn">导出副本</button>
        <button type="button" class="btn btn-sm" id="reconnectBtn" hidden>恢复同步</button>
        <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown" hidden>
      </div>
    </div>

    <!-- 应用内更新提醒：圆形箭头徽标 + 气泡提示（仅壳内出现） -->
    <div id="updateBadge" class="update-badge" hidden>
      <div class="update-badge-main">
        <button type="button" class="update-badge-btn" id="updateBadgeBtn" aria-label="一键更新到新版本">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M12 5.5v11M12 5.5l-5 5M12 5.5l5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="update-badge-text">
          <span class="update-badge-title" id="updateBadgeTitle">新版本</span>
          <span class="update-badge-action" id="updateBadgeAction">重启更新</span>
        </div>
      </div>
      <div class="update-badge-bubble" id="updateBadgeBubble" aria-hidden="true">点击查看更新</div>
    </div>

    <main id="app" tabindex="-1"></main>

    <footer class="footer">
      <span>日历内容只写入你选择的 MD 文件，不会上传</span>
      <span id="todayHint"></span>
    </footer>
  </div>

  <noscript>
    <p style="max-width: 640px; margin: 24px auto; font-family: system-ui, sans-serif;">
      这个日历需要启用 JavaScript 才能记录内容。
    </p>
  </noscript>

  <script src="assets/vendor/vditor/dist/index.min.js"></script>
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/native-bridge.js"></script>
  <script src="assets/github-sync.js"></script>
  <script src="assets/movie-source.js"></script>
  <script src="assets/film-identity.js"></script>
  <script src="assets/film-record.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
