name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag，如 v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage assets with ASCII names
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          cp "release/人生日历-${VERSION}-x64.zip" "LifeCalendar-${VERSION}-x64.zip"
          cp "release/人生日历-${VERSION}.apk" "LifeCalendar-${VERSION}.apk"
          ls -la LifeCalendar-*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag=false
          fi
          gh release create "$TAG" \
            --title "人生日历 ${VERSION}" \
            --generate-notes \
            --latest \
            "LifeCalendar-${VERSION}-x64.zip" \
            "LifeCalendar-${VERSION}.apk"
